[package]
name = "wzry-local-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lib]
name = "wzry_local_server"
path = "src/lib.rs"

[[bin]]
name = "wzry-local-server"
path = "src/main.rs"
